services:

  web-app:
    image: ${WEB_APP_IMAGE:-ghcr.io/dothongtri/web-app:0.9.1}
    container_name: web-app
    restart: always
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      # Đọc lúc runtime bởi Next.js server (src/app/api/[...path]/route.ts).
      # Dùng tên service nội bộ của Docker network, KHÔNG lộ ra trình duyệt.
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://identity-service:8080}

  identity-service:
    image: ${IDENTITY_IMAGE:-ghcr.io/dothongtri/identity-service:0.9.1}
    container_name: identity-service
    restart: always
    environment:
      - DBMS_CONNECTION=${DBMS_CONNECTION}
      - DBMS_USERNAME=${DBMS_USERNAME}
      - DBMS_PASSWORD=${DBMS_PASSWORD}

    ports:
      - "8080:8080"
    volumes:
      - "/home/ubuntu/logs:/logs"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    name: devteria-network
