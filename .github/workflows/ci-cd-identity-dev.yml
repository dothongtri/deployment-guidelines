name: CI/CD - Identity service (dev)

on:
  pull_request:
    branches: [dev]
    paths:
      - "identity-service/**"
      - "deployment/services/docker-compose.yml"
      - ".github/workflows/ci-cd-identity-dev.yml"

  push:
    branches: [dev]
    paths:
      - "identity-service/**"
      - "deployment/services/docker-compose.yml"
      - ".github/workflows/ci-cd-identity-dev.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GHCR chỉ cho phép GITHUB_TOKEN push vào namespace của chủ sở hữu repo.
  # Dùng github.repository_owner để image luôn khớp tài khoản/tổ chức thực tế.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/identity-service

jobs:
  test:
    name: Test Spring Boot application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: identity-service

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: identity-service/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B verify

  build_and_push:
    name: Build and publish Docker image
    needs: test
    runs-on: ubuntu-latest

    # PR chỉ test; push hoặc chạy thủ công trên dev mới publish image.
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./identity-service
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:dev

  deploy_local:
    name: Deploy to local Docker machine
    needs: build_and_push
    runs-on: [self-hosted, Windows, X64]
    environment: dev

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and restart identity service
        shell: powershell
        env:
          IDENTITY_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # .env bị gitignore nên runner không có; truyền thẳng để compose nội suy.
          DBMS_CONNECTION: ${{ secrets.DBMS_CONNECTION }}
          DBMS_USERNAME: ${{ secrets.DBMS_USERNAME }}
          DBMS_PASSWORD: ${{ secrets.DBMS_PASSWORD }}
        run: |
          docker compose -f deployment/services/docker-compose.yml pull identity-service
          docker compose -f deployment/services/docker-compose.yml up -d --no-deps identity-service
          docker compose -f deployment/services/docker-compose.yml ps identity-service
